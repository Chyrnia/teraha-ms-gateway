spring.application.name=gateway

server.port=8080

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

springdoc.swagger-ui.urls[0].name=Products
springdoc.swagger-ui.urls[0].url=/products/v3/api-docs
springdoc.swagger-ui.urls[1].name=Purchases
springdoc.swagger-ui.urls[1].url=/purchases/v3/api-docs
springdoc.swagger-ui.urls[2].name=Sales
springdoc.swagger-ui.urls[2].url=/sales/v3/api-docs
springdoc.swagger-ui.urls[3].name=Clients
springdoc.swagger-ui.urls[3].url=/clients/v3/api-docs
springdoc.swagger-ui.urls[4].name=Security
springdoc.swagger-ui.urls[4].url=/security/v3/api-docs

spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_LOCATION}
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=


